name: AI security review

# Automated security/logic/architecture review on every PR, using the official
# Claude Code Action with the maintained `code-review` plugin. Findings are
# posted back to the PR as comments. Read-only: the reviewer never edits code.
#
# SETUP (one-time): add a repo secret ANTHROPIC_API_KEY
#   (Settings → Secrets and variables → Actions). Use the same key as your
#   Vercel ANTHROPIC_API_KEY. Without it the job fails fast with a clear error.

# Runs once per PR (on open / marked-ready / reopen) — NOT on every push — and
# only when security-relevant code changes, to keep cost down. To re-review after
# new commits: mark the PR draft then "ready for review" again, or reopen it.
on:
  pull_request:
    types: [opened, ready_for_review, reopened]
    paths:
      - "app/api/**"
      - "app/admin/**"
      - "lib/**"
      - "proxy.ts"
      - "prisma/**"
      - "components/**"
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

# One review per PR; a new push cancels the in-flight review.
concurrency:
  group: ai-security-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Skip forks (no secret access) and draft PRs (review when marked ready).
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Guard — require ANTHROPIC_API_KEY
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
            echo "::error::ANTHROPIC_API_KEY repo secret is not set — add it under Settings → Secrets and variables → Actions to enable AI review."
            exit 1
          fi

      # Check out with full history + token-authed remote so the action can diff
      # against the base branch without configuring its own git auth (avoids the
      # "git fetch origin main … exit 128" failure on private repos).
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: AI security review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ github.token }}
          # Official, maintained review skill (covers correctness/logic + security).
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          # Sonnet 4.6 (balanced cost) + a system-prompt that steers the review
          # toward THIS codebase's risk surface. Reviewer is read-only.
          claude_args: |
            --model claude-sonnet-4-6
            --max-turns 12
            --disallowedTools Edit,Write,NotebookEdit
            --append-system-prompt "You are a senior application-security reviewer for an enterprise Next.js platform (forensic financial recovery + a youth/NGO arm, GICN). SCOPE: review ONLY this PR's changes — run `git diff origin/${{ github.base_ref }}...HEAD`, focus on the changed lines and the files they directly touch, and do NOT crawl the wider repository. Be efficient and concise. Prioritise, in order: (1) SECURITY — authn/authz bypass, missing requireAdmin()/permission (RBAC) checks on /api/admin/*, IDOR, injection, SSRF, secrets/PII exposure in API responses or logs, NDPA-2023 personal-data leakage (esp. minors' data and NIN), broken HMAC/signature verification, replay, unsafe redirects; (2) LOGIC — incorrect state transitions, race conditions/TOCTOU, capacity/limit bypass, error-handling gaps; (3) ARCHITECTURE — boundary violations, data-model/migration risks, fragile coupling. For each finding give severity (Critical/High/Medium/Low), the exact file:line, why it is exploitable/wrong, and a concrete fix. If the diff is clean, say so explicitly. Do not modify files."
