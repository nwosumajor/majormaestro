name: CI

# Regression safety net: typecheck + lint + unit tests on every PR and on push
# to main. Fast and secret-free — no DB or network needed (the tests cover pure,
# security/correctness-critical logic: Paystack signature/idempotency, CBN charge
# math, and the RBAC role-isolation matrix).

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # `npm ci` runs postinstall (prisma generate), which only reads the schema
      # — no database connection required.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

  # Integration tests exercise the real DB-touching logic (scholarship lifecycle,
  # ownership isolation) against an ephemeral Postgres service.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/testdb
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/testdb
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install
        run: npm ci
      - name: Apply migrations to the test database
        run: npx prisma migrate deploy
      - name: Integration tests
        run: npm run test:integration
